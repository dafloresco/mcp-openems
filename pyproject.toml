[project]
name = "mcp-openems"
version = "0.2.0"
description = "Servidor MCP para openEMS (FDTD) con modos ejecutor y tutor para la docencia de antenas"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Alonso Flores Córdova" }]
requires-python = ">=3.13"
# openEMS y CSXCAD se instalan aparte desde la carpeta python/ de la distribución de openEMS 0.37
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "numpy",
    "h5py",
    "matplotlib",
    "psutil",
]
